services:
  postgres:
    image: postgres:16-alpine
    container_name: mabeslink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mabeslink
      POSTGRES_USER: mabeslink
      POSTGRES_PASSWORD: mabeslink_local
    ports:
      - "5434:5432"
    volumes:
      - mabeslink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mabeslink -d mabeslink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mabeslink_postgres_data:
